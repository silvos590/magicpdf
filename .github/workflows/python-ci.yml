name: MAGIC PDF CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        uses: fregante/setup-git-user@v2.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          # flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --select=E9,F63,F7 --show-source --statistics
          # Exit-zero treats all errors as warnings (useful for TODO stage)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with unittest
        run: |
          cd tests
          python -m unittest discover

      - name: Get latest tag
        id: get_tag
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        run: |
          # Get latest tag or default to v1.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "latest=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          VERSION=${{ steps.get_tag.outputs.latest }}
          VERSION=${VERSION#v}    # remove "v"
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          PATCH=$((PATCH+1))
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        run: |
          VERSION="${{ steps.bump.outputs.new_tag }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # - name: Run tests with pytest and coverage
