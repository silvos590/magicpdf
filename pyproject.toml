[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magicpdf"
version = "0.1.1"
description = "A simple CLI to manipulate PDF files"
authors = [{ name = "Aldo Mollica" }]
dependencies = ["pypdf>=6.12.2", "Pillow>=12.2.0", "ocrmypdf>=17.4.2", "tesseract-ocr"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]   # ignore assets/

[project.scripts]
magicpdf = "cli.cli:main"
